      rho: 1940.0
      E: [43700000000.0, 16500000000.0, 15450000000.0]
      G: [3265000000.0, 3495000000.0, 3480000000.0]
      nu: [0.262, 0.264, 0.35]
      Xt: [640230000.0, 38100000.0, 0.0]
      Xc: [370690000.0, 82180000.0, 0]
      S: [30170000.0, 18970000.0, 6210000.0]
